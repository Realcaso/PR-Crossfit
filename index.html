<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrossFit PR</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CrossFit PR">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f4;--fg:#1b1b1b;--card:#fff;--mut:#777;--acc:#e8541e;--bd:#e3e3df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#1c1c1c;--mut:#999;--bd:#2c2c2c}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#1c1c1c;--mut:#999;--bd:#2c2c2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit}
button{padding:11px 14px;border-radius:8px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;width:100%}
button.ghost{background:none;color:var(--mut);border:1px solid var(--bd);width:auto;font-weight:400;padding:8px 12px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.big{font-size:20px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.best{color:var(--acc);font-weight:700;font-size:12px;margin-left:6px}
details summary{cursor:pointer;color:var(--acc);font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.p{background:var(--bg);border-radius:8px;padding:6px;text-align:center;font-size:14px}
.p b{display:block;font-size:12px;color:var(--mut);font-weight:500}
.del{float:right}
[hidden]{display:none!important}
.nav{background:var(--card);color:var(--fg);border:1px solid var(--bd);text-align:left;padding:18px;margin-bottom:10px;font-size:18px}
.nav span{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:4px}
.back{margin-bottom:6px}
.st{font-size:13px;color:var(--mut);margin:8px 0}
.st.err{color:#d33}
select{flex:1;min-width:0;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;width:100%;margin-bottom:8px}
.set input{margin-bottom:8px;width:100%;flex:none}

.fl{display:block;flex:1;font-size:12px;color:var(--mut)}
.fl input{width:100%;margin-top:4px}
.sm{padding:4px 10px!important}
#trun{border-radius:16px;padding:24px 12px;text-align:center;color:#fff;background:#555;min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:10px}
#trun.work{background:#e8541e}#trun.rest{background:#2a6fdb}#trun.done{background:#1f8f4e}
#rt{font-size:min(26vw,120px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#rl{font-size:22px;font-weight:700}
#trun .m{opacity:.85;font-size:15px}
#trun button{background:rgba(0,0,0,.3);margin-top:8px}
</style></head>
<body><main>
<div class="st" id="st"></div>
<div id="v-home">
<h1>🏋️ CrossFit PR</h1>
<button class="nav" data-go="prs">📋 I miei PR<span>Aggiungi nuovi PR e rivedi lo storico</span></button>
<button class="nav" data-go="calc">🧮 Calcolatore percentuali<span>Calcola i kg partendo da un PR o da un peso</span></button>
<button class="nav" data-go="timer">⏱️ Timer e workout<span>Crea workout con AMRAP, EMOM, Tabata, For Time e riposi</span></button>
<button class="nav" data-go="set">⚙️ Impostazioni GitHub<span>Collega il salvataggio online</span></button>
</div>
<div id="v-prs" hidden>
<button class="ghost back">← Home</button>
<h1>I miei PR</h1>
<div class="card">
  <div class="row"><input id="mov" list="movs" placeholder="Movimento (es. Back Squat)"></div>
  <div class="row"><input id="w" type="number" inputmode="decimal" step="0.5" placeholder="Peso (kg)"><input id="d" type="date"></div>
  <button id="add">Aggiungi PR</button>
</div>
<datalist id="movs"><option>Back Squat</option><option>Front Squat</option><option>Overhead Squat</option><option>Deadlift</option><option>Clean</option><option>Power Clean</option><option>Clean & Jerk</option><option>Snatch</option><option>Power Snatch</option><option>Shoulder Press</option><option>Push Press</option><option>Push Jerk</option><option>Bench Press</option><option>Thruster</option></datalist>
<div id="list"></div>
<div class="row" style="margin-top:18px"><button class="ghost" id="exp">Copia backup</button><button class="ghost" id="imp">Ripristina backup</button></div>
<p class="mut">I dati restano salvati su questo browser. Usa il backup per non perderli.</p>
</div>
<div id="v-calc" hidden>
<button class="ghost back">← Home</button>
<h1>Calcolatore</h1>
<div class="card"><select id="cb"></select>
<input id="cw" type="number" inputmode="decimal" step="0.5" placeholder="Peso base (kg)" style="width:100%;margin-bottom:8px">
<input id="cp" inputmode="decimal" placeholder="Percentuali, es. 72 o 70, 80, 87,5" style="width:100%;margin-bottom:8px">
<div class="grid" id="cr"></div></div>
</div>
<div id="v-timer" hidden>
<div id="tbuild">
<button class="ghost back">← Home</button>
<h1>Timer e workout</h1>
<div id="tsaved"></div>
<div class="card"><input id="tn" placeholder="Nome workout (es. Lunedì)" style="width:100%;margin-bottom:8px">
<div id="tb"></div>
<div class="row" style="margin-top:8px"><select id="tt" style="margin:0"></select><button id="tadd" style="width:auto;white-space:nowrap">+ Blocco</button></div></div>
<div class="row"><button id="tgo">▶ Avvia</button><button id="tsv" class="ghost" style="width:auto">Salva</button></div>
</div>
<div id="trun" hidden>
<div class="m" id="rb"></div><div id="rl"></div><div id="rt">00:00</div><div class="m" id="rn"></div>
<button id="rp">Pausa</button><button id="rs">Salta ⏭</button><button id="rx">Stop</button>
</div>
</div>
<div id="v-set" hidden>
<button class="ghost back">← Home</button>
<h1>Salvataggio su GitHub</h1>
<div class="card set"><input id="go" placeholder="Utente GitHub"><input id="gr" placeholder="Nome repository"><input id="gb" placeholder="Branch (default: main)"><input id="gt" type="password" placeholder="Token (fine-grained, solo Contents)">
<button id="gs">Salva e sincronizza</button>
<p class="mut">Il file dei PR sarà <b>prs.json</b> nel repository. Il token resta solo in questo browser.</p></div>
</div>
</main>
<script>
var K='cf_prs',prs=[];
try{prs=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){prs=[]}
function save(){try{localStorage.setItem(K,JSON.stringify(prs))}catch(e){}}
var $=function(i){return document.getElementById(i)};
$('d').value=new Date().toISOString().slice(0,10);
function r(x){return (Math.round(x*2)/2).toString().replace('.',',')}
function fd(s){var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function grp(){
  var g={};
  prs.forEach(function(p){var k=p.m.trim().toLowerCase();(g[k]=g[k]||[]).push(p)});
  Object.keys(g).forEach(function(k){g[k].sort(function(x,y){return y.d.localeCompare(x.d)||y.id-x.id})});
  return g;
}
function render(){
  var g=grp(),h='';
  Object.keys(g).sort().forEach(function(k){
    var a=g[k],cur=a[0],old=a.slice(1),grid='';
    for(var c=100;c>=50;c-=5)grid+='<div class="p"><b>'+c+'%</b>'+r(cur.w*c/100)+' kg</div>';
    h+='<div class="card"><div class="top"><b>'+esc(cur.m)+'</b><span class="mut">'+fd(cur.d)+'</span></div>'
      +'<div class="big">'+r(cur.w)+' kg</div>'
      +'<details><summary>Percentuali</summary><div class="grid">'+grid+'</div></details>';
    if(old.length){
      h+='<details><summary>Storico ('+old.length+')</summary>'+old.map(function(p){
        return '<div class="top" style="padding:6px 0;border-top:1px solid var(--bd);margin-top:6px"><span>'+r(p.w)+' kg <span class="mut">'+fd(p.d)+'</span></span><button class="ghost" data-id="'+p.id+'" style="padding:4px 10px">Elimina</button></div>';
      }).join('')+'</details>';
    }
    h+='<button class="ghost del" data-id="'+cur.id+'" style="margin-top:8px">Elimina ultimo PR</button><div style="clear:both"></div></div>';
  });
  $('list').innerHTML=h||'<p class="mut">Nessun PR ancora. Aggiungi il primo!</p>';
  if(window.fillCalc)fillCalc();
}
var C={};try{C=JSON.parse(localStorage.getItem('cf_cfg')||'{}')}catch(e){}
$('go').value=C.o||'';$('gr').value=C.r||'';$('gb').value=C.b||'';$('gt').value=C.t||'';
function on(){return C.o&&C.r&&C.t}
function st(t,e){$('st').textContent=t;$('st').className='st'+(e?' err':'')}
function b64(x){return btoa(unescape(encodeURIComponent(x)))}
function unb64(x){return decodeURIComponent(escape(atob(x.replace(/\n/g,''))))}
function url(){return 'https://api.github.com/repos/'+encodeURIComponent(C.o)+'/'+encodeURIComponent(C.r)+'/contents/prs.json'}
function hd(){return{'Authorization':'Bearer '+C.t,'Accept':'application/vnd.github+json'}}
function br(){return C.b||'main'}
async function pull(){
  var res=await fetch(url()+'?ref='+encodeURIComponent(br()),{headers:hd(),cache:'no-store'});
  if(res.status===404)return{data:[],sha:null};
  if(!res.ok)throw new Error('GitHub '+res.status);
  var j=await res.json();return{data:JSON.parse(unb64(j.content)||'[]'),sha:j.sha};
}
async function push(data,sha){
  var body={message:'Aggiorna PR',content:b64(JSON.stringify(data,null,1)),branch:br()};
  if(sha)body.sha=sha;
  var res=await fetch(url(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd()),body:JSON.stringify(body)});
  if(!res.ok)throw new Error('GitHub '+res.status);
}
async function sync(del){
  if(!on()){st('Solo locale: configura GitHub per sincronizzare.');return}
  st('Sincronizzo...');
  try{
    var r=await pull(),map={};
    r.data.forEach(function(p){map[p.id]=p});
    if(del)delete map[del];else prs.forEach(function(p){map[p.id]=p});
    var out=Object.keys(map).map(function(k){return map[k]});
    if(del||out.length!==r.data.length)await push(out,r.sha);
    prs=out;save();render();st('✓ Sincronizzato con GitHub');
  }catch(e){st('Errore: '+e.message+'. Dati tenuti in locale.',true)}
}
$('gs').onclick=function(){
  C={o:$('go').value.trim(),r:$('gr').value.trim(),b:$('gb').value.trim(),t:$('gt').value.trim()};
  try{localStorage.setItem('cf_cfg',JSON.stringify(C))}catch(e){}
  sync();
};
$('add').onclick=function(){
  var m=$('mov').value.trim(),w=parseFloat($('w').value.replace(',','.')),d=$('d').value;
  if(!m||!(w>0)||!d)return;
  prs.push({id:Date.now(),m:m,w:w,d:d});save();$('w').value='';render();sync();
};
$('list').onclick=function(e){
  var id=e.target.getAttribute&&e.target.getAttribute('data-id');
  if(id&&confirm('Eliminare questo PR?')){
    prs=prs.filter(function(p){return String(p.id)!==id});save();render();
    if(on())sync(Number(id));
  }
};
$('exp').onclick=function(){
  var t=JSON.stringify(prs);
  try{navigator.clipboard.writeText(t).then(function(){alert('Backup copiato negli appunti')})}catch(e){prompt('Copia il backup:',t)}
};
$('imp').onclick=function(){
  var t=prompt('Incolla il backup:');if(!t)return;
  try{var a=JSON.parse(t);if(Array.isArray(a)){prs=a;save();render()}}catch(e){alert('Backup non valido')}
};

function bestMap(){var g=grp(),b={};Object.keys(g).forEach(function(k){b[g[k][0].m]=g[k][0].w});return b}
function fillCalc(){
  var sel=$('cb'),old=sel.value,b=bestMap(),h='<option value="">Peso manuale</option>';
  Object.keys(b).sort().forEach(function(m){h+='<option value="'+b[m]+'">'+esc(m)+' - PR attuale '+r(b[m])+' kg</option>'});
  sel.innerHTML=h;
  if([].some.call(sel.options,function(o){return o.value===old}))sel.value=old;
  calc();
}
function calc(){
  var base=$('cb').value?parseFloat($('cb').value):parseFloat(($('cw').value||'').replace(',','.'));
  $('cw').disabled=!!$('cb').value;
  if($('cb').value)$('cw').value=r(base).replace(',','.');
  var ps=$('cp').value.split(/[;\s]+|,\s+/).join(' ').split(' ').map(function(x){return parseFloat(x.replace(',','.'))}).filter(function(x){return x>0});
  var h='';
  if(base>0)ps.forEach(function(c){h+='<div class="p"><b>'+String(c).replace('.',',')+'%</b>'+r(base*c/100)+' kg</div>'});
  $('cr').innerHTML=h;
}
$('cb').onchange=calc;$('cw').oninput=calc;$('cp').oninput=calc;

function show(v){['home','prs','calc','timer','set'].forEach(function(n){$('v-'+n).hidden=n!==v});window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-go]');
  if(t)show(t.getAttribute('data-go'));
  else if(e.target.classList&&e.target.classList.contains('back'))show('home');
});

var TY={
 amrap:{n:'AMRAP',f:[['min','Minuti',12]]},
 emom:{n:'EMOM',f:[['min','Minuti',10],['sec','Ogni (sec)',60]]},
 tabata:{n:'Tabata',f:[['w','Lavoro (s)',20],['r','Riposo (s)',10],['n','Round',8]]},
 interval:{n:'Intervalli',f:[['w','Lavoro (s)',40],['r','Riposo (s)',20],['n','Round',5]]},
 fortime:{n:'For Time',f:[['min','Time cap (min)',15]]},
 rest:{n:'Riposo',f:[['sec','Secondi',60]]}
};
var blocks=[],WO=[];
try{WO=JSON.parse(localStorage.getItem('cf_wo')||'[]')}catch(e){}
function saveWO(){try{localStorage.setItem('cf_wo',JSON.stringify(WO))}catch(e){}}
(function(){var h='';Object.keys(TY).forEach(function(k){h+='<option value="'+k+'">'+TY[k].n+'</option>'});$('tt').innerHTML=h})();
function renderSaved(){
  var h='';
  WO.forEach(function(w,i){
    h+='<div class="card"><div class="top"><b>'+esc(w.name)+'</b><span class="mut">'+w.blocks.length+' blocchi</span></div>'
     +'<div class="row" style="margin:8px 0 0"><button class="ghost sm" data-sv="load" data-i="'+i+'">Carica</button><button class="ghost sm" data-sv="del" data-i="'+i+'">Elimina</button></div></div>';
  });
  $('tsaved').innerHTML=h?'<h2>Workout salvati</h2>'+h+'<h2>Nuovo / modifica</h2>':'';
}
function renderBlocks(){
  var h='';
  blocks.forEach(function(b,i){
    var T=TY[b.t];
    h+='<div class="card" style="background:var(--bg)"><div class="top"><b>'+(i+1)+'. '+T.n+'</b><span>'
     +'<button class="ghost sm" data-act="up" data-i="'+i+'">↑</button> <button class="ghost sm" data-act="dn" data-i="'+i+'">↓</button> <button class="ghost sm" data-act="rm" data-i="'+i+'">✕</button></span></div>'
     +'<input data-nm="1" data-i="'+i+'" placeholder="Nome / esercizi (facoltativo)" value="'+esc(b.name||'')+'" style="width:100%;margin:8px 0">'
     +'<div class="row" style="margin:0">';
    T.f.forEach(function(f){h+='<label class="fl">'+f[1]+'<input type="number" inputmode="numeric" min="1" value="'+b.v[f[0]]+'" data-i="'+i+'" data-k="'+f[0]+'"></label>'});
    h+='</div></div>';
  });
  $('tb').innerHTML=h||'<p class="mut">Nessun blocco. Aggiungine uno qui sotto.</p>';
  renderSaved();
}
$('tadd').onclick=function(){
  var t=$('tt').value,v={};TY[t].f.forEach(function(f){v[f[0]]=f[2]});
  blocks.push({t:t,v:v,name:''});renderBlocks();
};
$('tb').addEventListener('input',function(e){
  var el=e.target,i=el.getAttribute('data-i');if(i===null)return;
  if(el.getAttribute('data-nm'))blocks[i].name=el.value;
  else blocks[i].v[el.getAttribute('data-k')]=Math.max(1,Math.floor(Number(el.value))||1);
});
$('tb').addEventListener('click',function(e){
  var a=e.target.getAttribute('data-act'),i=Number(e.target.getAttribute('data-i'));if(!a)return;
  if(a==='rm')blocks.splice(i,1);
  else if(a==='up'&&i>0){var t=blocks[i];blocks[i]=blocks[i-1];blocks[i-1]=t}
  else if(a==='dn'&&i<blocks.length-1){var u=blocks[i];blocks[i]=blocks[i+1];blocks[i+1]=u}
  renderBlocks();
});
$('tsaved').addEventListener('click',function(e){
  var a=e.target.getAttribute('data-sv'),i=Number(e.target.getAttribute('data-i'));if(!a)return;
  if(a==='load'){blocks=JSON.parse(JSON.stringify(WO[i].blocks));$('tn').value=WO[i].name;renderBlocks();window.scrollTo(0,document.body.scrollHeight)}
  else if(confirm('Eliminare questo workout?')){WO.splice(i,1);saveWO();renderSaved()}
});
$('tsv').onclick=function(){
  if(!blocks.length)return;
  var n=$('tn').value.trim()||'Workout',w={name:n,blocks:JSON.parse(JSON.stringify(blocks))},k=-1;
  WO.forEach(function(x,i){if(x.name===n)k=i});
  if(k>=0)WO[k]=w;else WO.push(w);
  saveWO();renderSaved();
};
function expand(){
  var P=[{label:'Pronti',sub:'',dur:5,kind:'ready',bi:-1}];
  blocks.forEach(function(b,bi){
    var v=b.v,T=TY[b.t].n,nm=b.name||'';
    if(b.t==='amrap')P.push({label:T,sub:nm,dur:v.min*60,kind:'work',bi:bi});
    else if(b.t==='emom'){var n=Math.max(1,Math.floor(v.min*60/v.sec));for(var i=1;i<=n;i++)P.push({label:T,sub:(nm?nm+' · ':'')+'Giro '+i+'/'+n,dur:v.sec,kind:'work',bi:bi})}
    else if(b.t==='tabata'||b.t==='interval'){for(var j=1;j<=v.n;j++){
      P.push({label:T,sub:(nm?nm+' · ':'')+'Round '+j+'/'+v.n,dur:v.w,kind:'work',bi:bi});
      if(j<v.n&&v.r>0)P.push({label:'Riposo',sub:'Round '+j+'/'+v.n,dur:v.r,kind:'rest',bi:bi});
    }}
    else if(b.t==='fortime')P.push({label:T,sub:nm+(nm?' · ':'')+'cap '+v.min+' min',dur:v.min*60,up:true,kind:'work',bi:bi});
    else if(b.t==='rest')P.push({label:'Riposo',sub:nm,dur:v.sec,kind:'rest',bi:bi});
  });
  return P;
}
var R=null,AC=null;
function beep(f,d){
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=f;g.gain.value=0.25;o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function mmss(x){x=Math.max(0,Math.floor(x));var m=Math.floor(x/60),s=x%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function draw(){
  var p=R.ph[R.i],n=R.ph[R.i+1];
  $('trun').className=p.kind==='work'?'work':p.kind==='rest'?'rest':'';
  $('rb').textContent=p.bi<0?'Preparati':'Blocco '+(p.bi+1)+'/'+blocks.length;
  $('rl').textContent=p.label+(p.sub?' · '+p.sub:'');
  $('rn').textContent=n?'Prossimo: '+n.label+(n.sub?' · '+n.sub:''):'Ultimo blocco';
  $('rs').textContent=p.up?'Fatto ✓':'Salta ⏭';
}
function tick(){
  if(!R||R.done)return;
  var now=Date.now();
  if(!R.paused)R.el+=now-R.last;
  R.last=now;
  var p=R.ph[R.i],sec=R.el/1000,rem=p.dur-sec;
  $('rt').textContent=p.up?mmss(sec):mmss(Math.ceil(rem));
  if(rem<=3&&rem>0){var s=Math.ceil(rem);if(s!==R.ls){R.ls=s;beep(660,0.12)}}
  if(rem<=0)next();
}
function next(){
  R.i++;R.el=0;R.ls=null;
  if(R.i>=R.ph.length){finish();return}
  beep(988,0.45);vib([200]);draw();
}
function finish(){
  R.done=true;clearInterval(R.t);
  beep(988,0.3);setTimeout(function(){beep(988,0.3)},400);setTimeout(function(){beep(1318,0.6)},800);vib([300,150,300]);
  $('trun').className='done';$('rl').textContent='Workout finito 🎉';$('rt').textContent='Bravo!';

};
